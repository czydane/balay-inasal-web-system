<title>Restaurant Management System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with tab navigation; each tab is a working screen; payment and receipt open in a modal. */
:root{
  --bg:#fdf9ea; --surface:#ffffff; --ink:#262846; --muted:#5f6280; --line:#e8e0c4;
  --accent:#cf3a3b; --accent-ink:#ffffff; --accent-soft:#fdebb0; --hl:#fad645; --hl-ink:#30324e; --hl-line:#e3b81c; --brand-green:#709b2c;
  --danger:#a32121; --danger-soft:#fde3df; --warn:#7a5200; --warn-soft:#fdf0c4; --ok:#43690f; --ok-soft:#e6f1cf;
  --paper:#fffef9; --paper-ink:#1b1b1b;
  --f-display:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d2040; --surface:#272b52; --ink:#fdf1cf; --muted:#b7b9d8; --line:#3b4075; --accent:#f26364; --accent-ink:#1d2040; --accent-soft:#3d3f6b; --hl:#fad645; --hl-ink:#30324e; --hl-line:#fad645; --brand-green:#8fbf45;
  --danger:#ff9e96; --danger-soft:#4a2230; --warn:#f2c94c; --warn-soft:#3d3420; --ok:#b5dd7a; --ok-soft:#2a3b22; --paper:#2f3358; --paper-ink:#fdf1cf; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d2040; --surface:#272b52; --ink:#fdf1cf; --muted:#b7b9d8; --line:#3b4075; --accent:#f26364; --accent-ink:#1d2040; --accent-soft:#3d3f6b; --hl:#fad645; --hl-ink:#30324e; --hl-line:#fad645; --brand-green:#8fbf45;
  --danger:#ff9e96; --danger-soft:#4a2230; --warn:#f2c94c; --warn-soft:#3d3420; --ok:#b5dd7a; --ok-soft:#2a3b22; --paper:#2f3358; --paper-ink:#fdf1cf; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{font:700 18px var(--f-display);display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
nav button:hover{background:var(--bg)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;text-align:center;margin-left:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:16px}
.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media(max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{font-size:17px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;flex:1 1 130px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);width:100%;min-width:0}
input:focus,select:focus{border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.d{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:8px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--danger-soft);color:var(--danger)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.muted{color:var(--muted)} .err{color:var(--danger);font-size:13px;min-height:20px;margin-top:8px;white-space:pre-line}
.total{font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tcard{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.tcard b{font:700 20px var(--f-display)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(5,15,12,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:900px;margin-block:auto}
.modal h2{margin-bottom:12px}
.rcpt{font:12.5px/1.45 var(--f-mono);background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:8px;padding:14px;white-space:pre;overflow:auto;margin:0;min-width:0}
#toastHost{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;max-width:90vw;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px}
.stat{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px}
.stat div span{display:block;font-size:12px;color:var(--muted)}
.stat div b{font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted)}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
/* UX layer: large targets (Fitts), instant feedback (Doherty), one loud action per screen (Von Restorff), numbered chunks (Miller) */
button{transition:background-color .15s,border-color .15s,transform .1s}
.btn{min-height:44px;padding-inline:16px}
.btn.sm{min-height:40px;padding-inline:14px;font-size:13px}
.btn.lg{min-height:54px;font-size:16px;font-weight:600;width:100%}
.btn:active{transform:scale(.97)}
.btn.p{box-shadow:0 2px 0 rgba(0,0,0,.2)}
nav button,.seg button,.chip{min-height:44px}
.chip{padding-inline:14px}
input,select{min-height:44px}
.step{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step h2{margin:0}
.step i{font:700 13px var(--f-display);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty button{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:18px;cursor:pointer}
.qty button:hover{border-color:var(--accent)}
.qty b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.linkd{border:0;background:none;color:var(--danger);cursor:pointer;min-height:44px;padding:0 8px;font-weight:500}
.mobbar{display:none}
@media(max-width:820px){.mobbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px;align-items:center}.mobbar .total{font-size:18px}.mobbar .btn{flex:1}.wrap{padding-bottom:110px}}
.login{max-width:400px;margin:32px auto;padding:24px}
.login .mark{width:48px;height:48px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 22px var(--f-display);margin-bottom:14px}
.login h2{font-size:22px;margin-bottom:4px}
.pw{position:relative}.pw input{padding-right:72px}.pw button{position:absolute;right:4px;top:4px;min-height:36px;border:0;background:none;color:var(--accent);cursor:pointer;font-weight:500}
.plate{background:#fff;border-radius:10px;display:inline-flex;align-items:center;padding:2px 6px;line-height:0}
.plate img{display:block;height:44px;width:auto;max-width:100%}
.plate.big{display:flex;justify-content:center;padding:10px;margin-bottom:16px;border:1px solid var(--line);border-radius:12px}
.plate.big img{width:min(100%,320px);height:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* brand palette from the Balai Inasal logo: coral action, sunshine-yellow highlight, navy text, bamboo green for success */
nav button[aria-current="page"]{background:var(--hl);color:var(--hl-ink);font-weight:600}
.chip[aria-pressed="true"]{background:var(--hl);border-color:var(--hl-line);color:var(--hl-ink);font-weight:600}
.step i{background:var(--hl);color:var(--hl-ink)}
.btn.p{box-shadow:0 2px 0 rgba(48,50,78,.35)}
.login{border-top:6px solid var(--hl)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const fmtTime=t=>{let [h,m]=t.split(':').map(Number);const p=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${p}`};

/* ---------- bill ---------- */
function makeBill(o,discIdx,custPct,custAmt){
  const sub=ordTotal(o);
  let da=0;
  if(discIdx===4)da=r2(sub*Math.max(0,Math.min(100,custPct))/100);
  else if(discIdx===5)da=r2(Math.min(sub,Math.max(0,custAmt)));
  else da=r2(sub*DISCOUNTS[discIdx][1]);
  const ds=r2(sub-da), sc=r2(ds*SERVICE), tax=r2((ds+sc)*TAX), total=r2(ds+sc+tax);
  return {sub,da,ds,sc,tax,total,discName:DISCOUNTS[discIdx][0]};
}
function prepMinutes(o){
  let longest=0,p=0;
  for(const l of o.items){const m=item(l.id);const c=(m?m.category:'').toLowerCase();
    const mins=c.startsWith('starter')?10:c.startsWith('main')?20:c.startsWith('side')?8:c.startsWith('dessert')?7:c.startsWith('bev')?5:10;
    longest=Math.max(longest,mins);p+=l.qty}
  return p?longest+Math.min(15,p-1):0;
}
function validatePayment(b,method,amount,ref,expected){
  if(b.total<=0)return 'There is nothing to pay for.';
  if(!method)return 'Please choose a payment method.';
  if(!Number.isFinite(amount))return 'Enter a valid amount.';
  if(amount<=0)return 'Payment must be greater than 0.';
  if(method===METHODS[0]){return r2(amount)<b.total?`Insufficient payment. You still owe ${php(b.total-r2(amount))}.`:null}
  if(r2(amount)!==b.total)return `Card and e-wallet payments must be exactly ${php(b.total)}.`;
  if(!ref||!ref.trim())return 'Enter the reference number shown on the receipt.';
  if(ref.trim().toUpperCase()!==expected)return 'The reference number does not match the receipt.\nEnter the exact reference shown on the receipt.';
  if(!/^[A-Za-z0-9\-]{4,20}$/.test(ref.trim()))return 'Enter a valid reference number (4-20 letters, numbers or dashes).';
  return null;
}
function newRef(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='REF-';const a=new Uint32Array(8);crypto.getRandomValues(a);for(const x of a)s+=c[x%c.length];return s}

/* ---------- receipt text (44 columns) ---------- */
function receiptText(o,b,opt){
  const W=44, EQ='='.repeat(W), LN='-'.repeat(W);
  const ctr=s=>' '.repeat(Math.max(0,Math.floor((W-s.length)/2)))+s;
  const fit=(s,w)=>s.length<=w?s:s.slice(0,w-1)+'.';
  const pad=(s,w)=>String(s).padEnd(w), lp=(s,w)=>String(s).padStart(w);
  const m=v=>php(v);
  const row=(l,v)=>pad(l,26)+' '+lp(m(v),17);
  const fld=(l,v)=>pad(l,16)+': '+v;
  const L=[];
  const pv=opt.preview;
  L.push(EQ,ctr(pv?'BILLING STATEMENT':'OFFICIAL RECEIPT'),ctr(pv?'Please review before paying':'Thank you for dining with us!'),EQ);
  L.push(fld('Receipt No.',opt.receiptNo),fld(pv?'Date':'Date Paid',opt.paidOn),fld('Status',pv?'AWAITING PAYMENT':'PAID'),LN);
  L.push('RESERVATION',fld('Customer',o.customer));
  if(o.table===0){L.push(fld('Order Type','Take Out'),fld('Pickup',fmtDate(o.date)+' at '+fmtTime(o.time)))}
  else{const t=table(o.table);L.push(fld('Order Type','Dine In'),fld('Table',o.table+(t?` (${t.location}, ${t.capacity} seats)`:'')),fld('Reserved For',fmtDate(o.date)+' at '+fmtTime(o.time)))}
  const pm=prepMinutes(o); if(pm)L.push(fld('Est. Prep Time',pm+' minutes'));
  L.push(LN,pad('ITEM',18)+' '+lp('QTY',3)+' '+lp('PRICE',9)+' '+lp('AMOUNT',10),LN);
  for(const l of o.items){const mi=item(l.id)||l;L.push(pad(fit(mi.name,18),18)+' '+lp(l.qty,3)+' '+lp(mi.price.toLocaleString('en-US',{minimumFractionDigits:2}),9)+' '+lp((mi.price*l.qty).toLocaleString('en-US',{minimumFractionDigits:2}),10))}
  L.push(LN,row('Subtotal',b.sub));
  if(b.da>0){L.push(row('Discount',-b.da),'  ('+b.discName+')');if(opt.discId)L.push('  ID No.: '+opt.discId)}else L.push(row('Discount',0));
  L.push(row('Service Charge (10%)',b.sc),row('VAT (12%)',b.tax),EQ,row(pv?'TOTAL AMOUNT DUE':'TOTAL AMOUNT',b.total),EQ);
  L.push('PAYMENT',fld('Method',opt.method||'-'));
  const cash=opt.method===METHODS[0];
  if(opt.method&&!cash)L.push(fld('Reference No.',opt.ref||'-'));
  if(opt.amount!=null){
    L.push(row('Amount Received',opt.amount));
    const diff=r2(opt.amount-b.total);
    if(cash||diff<0)L.push(diff>=0?row('Change',diff):row('Balance Due',-diff));else L.push(row('Change',0));
  }else L.push(fld('Amount Received','(enter below)'));
  L.push(EQ);
  if(!pv)L.push(ctr('PAYMENT SUCCESSFUL'),ctr('Please come again!'),EQ);
  return L.join('\n');
}

function place(pay){
  const e=t=>{$('#oErr').textContent=t};
  const dine=orderType==='Dine In';
  const name=form.customer.trim();
  if(!name)return e('Enter the customer name.');
  if(!form.date)return e('Choose a date.');
  if(form.date<todayISO())return e('The date cannot be in the past.');
  if(!form.time)return e('Choose a time.');
  const [h,mi]=form.time.split(':').map(Number);const tm=h*60+mi;
  if(tm<480||tm>1380)return e('Selected time is outside operating hours.\nChoose a time from 8:00 AM to 11:00 PM.');
  let tn=0;
  if(dine){
    const g=parseInt(form.guests)||0;if(g<=0)return e('Number of guests must be greater than 0.');
    tn=parseInt(form.table);const t=table(tn);
    if(!t||t.reserved)return e('Choose an available table.');
    if(g>t.capacity)return e(`This table can only accommodate ${t.capacity} guests.`);
  }
  const lines=Object.entries(cart).map(([id,q])=>({id:+id,q})).filter(l=>item(l.id));
  if(!lines.length)return e('You have not ordered anything.');
  for(const l of lines){if(item(l.id).stock<l.q)return e(`Not enough stock for ${item(l.id).name}.`)}
  for(const l of lines)item(l.id).stock-=l.q;
  const o={id:S.nextOrderId++,customer:name,table:tn,date:form.date,time:form.time,guests:dine?parseInt(form.guests):0,
    items:lines.map(l=>({id:l.id,name:item(l.id).name,price:item(l.id).price,qty:l.q}))};
  S.orders.push(o);
  if(dine){const t=table(tn);t.reserved=true;t.customer=name;t.date=o.date;t.time=o.time}
  cart={};form.customer='';save();
  if(pay)openPayment(o.id);else{toast('Order saved. Find it under View Orders.');view='orders';render()}
}

    $('#mAddB').onclick=()=>{const m=item(+$('#mAdd').value),n=parseInt($('#mAddQ').value)||0;
      if(!m)return fail('Choose a dish.');if(n<=0)return fail('Quantity must be greater than 0.');if(n>m.stock)return fail('Not enough stock available.');
      m.stock-=n;const ex=o.items.find(l=>l.id===m.id);if(ex)ex.qty+=n;else o.items.push({id:m.id,name:m.name,price:m.price,qty:n});msg='';draw()};
    const mv=$('#mMoveB');if(mv)mv.onclick=()=>{const n=parseInt($('#mMove').value);const t=table(n);if(!t)return;
      const old=table(o.table);freeTable(o.table);t.reserved=true;t.customer=o.customer;t.date=o.date;t.time=o.time;o.table=n;msg='Order moved to table '+n+'.';draw()};
  };
  draw();
}

/* ---------- Payment ---------- */
function openPayment(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  if(!o.items.length){toast('This order has no items.');return}
  const st={disc:0,pct:'',amt:'',discId:'',method:METHODS[0],amount:'',ref:'',expected:null,msg:'',receiptNo:'OR-'+String(S.receiptCounter).padStart(6,'0')};
  const stamp=nowStamp();
  const bill=()=>makeBill(o,st.disc,parseFloat(st.pct)||0,parseFloat(st.amt)||0);
  const preview=()=>{
    const b=bill();const cash=st.method===METHODS[0];
    const a=st.method?(cash?(st.amount===''?null:parseFloat(st.amount)):b.total):null;
    return receiptText(o,b,{preview:true,receiptNo:st.receiptNo,paidOn:stamp,discId:st.disc?st.discId:'',method:st.method,ref:st.expected,amount:Number.isFinite(a)?a:null});
  };
  const draw=()=>{
    const b=bill(),cash=st.method===METHODS[0];
    const quick=[...new Set([b.total,...[100,500,1000].map(n=>Math.ceil(b.total/n)*n)])];
    modal(`<h2>Payment · ${esc(o.customer)}</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start">
     <div><div class="row"><label>Discount<select id="pDisc">${DISCOUNTS.map((d,i)=>`<option value="${i}" ${i===st.disc?'selected':''}>${d[0]}</option>`).join('')}</select></label></div>
      ${st.disc===4?`<div class="row" style="margin-top:8px"><label>Percentage (0-100)<input id="pPct" type="number" min="0" max="100" value="${esc(st.pct)}"></label></div>`:''}
      ${st.disc===5?`<div class="row" style="margin-top:8px"><label>Amount (PHP)<input id="pAmt" type="number" min="0" value="${esc(st.amt)}"></label></div>`:''}
      ${st.disc>=1&&st.disc<=2?`<div class="row" style="margin-top:8px"><label>${DISCOUNTS[st.disc][0].split(' (')[0]} ID number<input id="pDid" value="${esc(st.discId)}"></label></div>`:''}
      <div style="margin-top:12px" class="hint">Payment method</div>
      <div class="tabs" style="margin-top:4px">${METHODS.map(m=>`<button type="button" class="chip" aria-pressed="${st.method===m}" data-m="${esc(m)}">${m}</button>`).join('')}</div>
      ${st.method?(cash?`<div class="row"><label>Cash received (PHP)<input id="pAmount" type="number" min="0" step="0.01" value="${esc(st.amount)}" placeholder="${b.total.toFixed(2)}"></label></div><div class="tabs" style="margin-top:8px">${quick.map((v,i)=>`<button type="button" class="chip" data-q="${v}">${i===0?'Exact':php(v)}</button>`).join('')}</div>`
        :`<p class="hint">Amount due ${php(b.total)}. Type the reference number shown on the statement to confirm.</p><div class="row"><label>Reference / approval number<input id="pRef" value="${esc(st.ref)}" placeholder="REF-XXXXXXXX" autocomplete="off"></label></div>`):''}
      <div class="err" id="pErr">${esc(st.msg)}</div>
      <div><button class="btn p lg" id="pPay" type="button" ${st.method?'':'disabled'}>Pay ${php(b.total)}</button></div><div class="row" style="margin-top:8px"><button class="btn" id="pCancel" type="button">Back to orders</button></div></div>
     <div style="min-width:0"><pre class="rcpt" id="pPrev">${esc(preview())}</pre></div></div>`);
    $('#pDisc').onchange=e=>{st.disc=+e.target.value;st.msg='';draw()};
    const pp=$('#pPct');if(pp)pp.oninput=()=>{st.pct=pp.value;upd()};
    const pa=$('#pAmt');if(pa)pa.oninput=()=>{st.amt=pa.value;upd()};
    const pd=$('#pDid');if(pd)pd.oninput=()=>{st.discId=pd.value;upd()};
    document.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{st.method=x.dataset.m;st.msg='';st.amount='';st.ref='';st.expected=st.method===METHODS[0]?null:(st.expected||newRef());draw()});
    const am=$('#pAmount');if(am){am.oninput=()=>{st.amount=am.value;upd()};}
    document.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{st.amount=String(x.dataset.q);st.msg='';draw()});
    const rf=$('#pRef');if(rf)rf.oninput=()=>{st.ref=rf.value};
    $('#pCancel').onclick=()=>{closeModal();render()};
    $('#pPay').onclick=()=>{
      const b2=bill();
      if(st.disc===4&&!(parseFloat(st.pct)>=0))return fail('Enter a discount percentage.');
      if(st.disc>=1&&st.disc<=2&&!st.discId.trim())return fail('Enter the discount ID number.');
      const amount=st.method===METHODS[0]?parseFloat(st.amount):b2.total;
      const e=validatePayment(b2,st.method,amount,st.ref,st.expected);
      if(e)return fail(e);
      complete(o,b2,st,amount,stamp);
    };
    function fail(t){st.msg=t;const e=$('#pErr');if(e)e.textContent=t}
    function upd(){$('#pPrev').textContent=preview()}
  };
  draw();
}
function complete(o,b,st,amount,stamp){
  const receiptNo='OR-'+String(S.receiptCounter++).padStart(6,'0');
  const method=st.method,cash=method===METHODS[0];
  const text=receiptText(o,b,{preview:false,receiptNo,paidOn:stamp,discId:st.disc?st.discId.trim():'',method,ref:cash?null:st.ref.trim().toUpperCase(),amount:r2(amount)});
  S.sales.push({date:todayISO(),customer:o.customer,table:o.table,subtotal:b.sub,discount:b.discName,discountAmt:b.da,total:b.total,method,receipt:receiptNo});
  if(o.table)freeTable(o.table);
  S.orders=S.orders.filter(x=>x!==o);save();
  modal(`<h2>Payment successful</h2><pre class="rcpt">${esc(text)}</pre><div class="row" style="margin-top:12px"><button class="btn p" id="rCopy" type="button">Copy receipt</button><button class="btn" id="rDone" type="button">Done</button></div><div class="hint" style="margin-top:6px">Printing is not available inside the viewer. Copy the receipt text to save or print it elsewhere.</div>`);
  $('#rCopy').onclick=()=>{navigator.clipboard.writeText(text).then(()=>toast('Receipt copied'),()=>toast('Select the receipt text and copy it manually'))};
  $('#rDone').onclick=()=>{closeModal();view='orders';render()};
}

function vTables(){
  $('#main').innerHTML=`<div class="card"><h2>Table status</h2><div class="tables">${S.tables.map(t=>`<div class="tcard"><div class="hdr" style="margin:0"><b>Table ${t.number}</b><span class="pill ${t.reserved?'bad':'ok'}">${t.reserved?'Reserved':'Available'}</span></div>
   <span class="muted">${esc(t.location)} · ${t.capacity} seats</span>${t.reserved?`<span>${esc(t.customer)}</span><span class="hint">${fmtDate(t.date)} at ${fmtTime(t.time)}</span>`:''}
   ${staff?`<div class="row">${t.reserved?`<button class="btn sm" data-clear="${t.number}" type="button">Clear</button>`:`<button class="btn sm d" data-rmt="${t.number}" type="button">Remove</button>`}</div>`:''}</div>`).join('')||'<p class="muted">No tables.</p>'}</div>
   ${staff?`<h2 style="margin-top:18px">Add table</h2><div class="row"><label>Capacity<input id="nCap" type="number" min="1" value="4"></label><label>Location<input id="nLoc" placeholder="e.g. Terrace"></label><button class="btn p" id="nAdd" type="button">Add table</button></div><div class="err" id="tErr"></div>`:'<p class="hint" style="margin-top:12px">Staff login unlocks table management.</p>'}</div>`;
  document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{const n=+b.dataset.clear;
    if(S.orders.some(o=>o.table===n)){return toast('Table has a pending order. Use View Orders.')}freeTable(n);render()});
  document.querySelectorAll('[data-rmt]').forEach(b=>b.onclick=()=>{S.tables=S.tables.filter(t=>t.number!==+b.dataset.rmt);toast('Table removed');render()});
  const add=$('#nAdd');if(add)add.onclick=()=>{const c=parseInt($('#nCap').value),l=$('#nLoc').value.trim();
    if(!(c>0))return $('#tErr').textContent='Capacity must be greater than 0.';if(!l)return $('#tErr').textContent='Enter a location.';
    const n=S.tables.reduce((m,t)=>Math.max(m,t.number),0)+1;S.tables.push({number:n,capacity:c,location:l,reserved:false});toast('Table '+n+' added');render()};
}

function vMenu(){
  $('#main').innerHTML=`<div class="grid">${CATS.map(c=>`<div class="card"><h2>${c}</h2><div class="scroll"><table class="tbl"><thead><tr><th>Item</th><th class="n">Price</th><th class="n">Stock</th>${staff?'<th></th>':''}</tr></thead><tbody>
  ${S.menu.filter(m=>m.category===c).map(m=>`<tr><td>${esc(m.name)}</td>${staff?`<td class="n"><input type="number" min="0" step="0.01" value="${m.price}" data-p="${m.id}" style="width:100px" aria-label="Price of ${esc(m.name)}"></td><td class="n"><input type="number" min="0" value="${m.stock}" data-s="${m.id}" style="width:80px" aria-label="Stock of ${esc(m.name)}"></td><td class="n"><button class="btn sm d" data-del="${m.id}" type="button">Remove</button></td>`
    :`<td class="n">${php(m.price)}</td><td class="n">${m.stock>0?m.stock:'<span class="pill bad">Out</span>'}</td>`}</tr>`).join('')}</tbody></table></div></div>`).join('')}
  ${staff?`<div class="card"><h2>Add menu item</h2><div class="row"><label>Name<input id="aName"></label><label>Category<select id="aCat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Price<input id="aPrice" type="number" min="0" step="0.01"></label><label>Stock<input id="aStock" type="number" min="0" value="10"></label><button class="btn p" id="aAdd" type="button">Add item</button></div><div class="err" id="aErr"></div></div>`:'<p class="hint">Staff login unlocks price and stock editing.</p>'}</div>`;
  document.querySelectorAll('[data-p]').forEach(i=>i.onchange=()=>{const v=parseFloat(i.value);if(!(v>=0))return toast('Enter a valid price.');item(+i.dataset.p).price=v;save();toast('Price updated')});
  document.querySelectorAll('[data-s]').forEach(i=>i.onchange=()=>{const v=parseInt(i.value);if(!(v>=0))return toast('Enter a valid stock.');item(+i.dataset.s).stock=v;save();toast('Stock updated')});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const id=+b.dataset.del;
    if(S.orders.some(o=>o.items.some(l=>l.id===id)))return toast('That item is in a pending order.');S.menu=S.menu.filter(m=>m.id!==id);delete cart[id];render()});
  const a=$('#aAdd');if(a)a.onclick=()=>{const n=$('#aName').value.trim(),p=parseFloat($('#aPrice').value),s=parseInt($('#aStock').value);
    if(!n)return $('#aErr').textContent='Enter an item name.';if(!(p>=0))return $('#aErr').textContent='Enter a valid price.';if(!(s>=0))return $('#aErr').textContent='Enter a valid stock.';
    S.menu.push({id:S.nextMenuId++,name:n,category:$('#aCat').value,price:p,stock:s});toast('Item added');render()};
}

    <div class="grid"><label>Username<input id="lu" autocomplete="username"></label>
    <label>Password<div class="pw"><input id="lp" type="password" autocomplete="current-password"><button type="button" id="lshow">Show</button></div></label>
    <button class="btn p lg" id="lb" type="submit">Sign in</button></div><div class="err" id="le" role="alert"></div>

    $('#lf').onsubmit=e=>{e.preventDefault();if($('#lu').value==='admin'&&$('#lp').value==='admin123'){staff=true;render();toast('Signed in')}else $('#le').textContent='Username or password is incorrect. Check them and try again.'};
    $('#lshow').onclick=()=>{const p=$('#lp'),h=p.type==='password';p.type=h?'text':'password';$('#lshow').textContent=h?'Hide':'Show'};
    $('#ldemo').onclick=()=>{$('#lu').value='admin';$('#lp').value='admin123';$('#lb').focus()};
    $('#lu').focus();return;
  }
  const dates=[...new Set(S.sales.map(s=>s.date))].sort().reverse();
  const rows=S.sales.filter(s=>salesDate==='all'||s.date===salesDate);
  const sum=rows.reduce((t,s)=>t+s.total,0);
  const byMethod=METHODS.map(m=>[m,rows.filter(s=>s.method===m).reduce((t,s)=>t+s.total,0)]);
  $('#main').innerHTML=`<div class="grid">
   <div class="card"><div class="hdr"><h2 style="margin:0">Daily sales</h2><button class="btn sm d" id="out" type="button">Staff logout</button></div>
    <div class="row" style="margin-bottom:12px"><label style="flex:0 1 220px">Date<select id="sDate"><option value="all">All dates</option>${dates.map(d=>`<option value="${d}" ${d===salesDate?'selected':''}>${fmtDate(d)}</option>`).join('')}</select></label></div>
    <div class="stat"><div><span>Transactions</span><b>${rows.length}</b></div><div><span>Total sales</span><b>${php(sum)}</b></div>${byMethod.map(([m,v])=>`<div><span>${m}</span><b>${php(v)}</b></div>`).join('')}</div>
    <div class="scroll"><table class="tbl"><thead><tr><th>Paid date</th><th>Customer</th><th>Table</th><th class="n">Subtotal</th><th>Discount</th><th class="n">Discount amt</th><th class="n">Total</th><th>Method</th></tr></thead><tbody>
    ${rows.slice().reverse().map(s=>`<tr><td>${fmtDate(s.date)}</td><td>${esc(s.customer)}</td><td>${tlabel(s.table)}</td><td class="n">${php(s.subtotal)}</td><td>${esc(s.discount)}</td><td class="n">${php(s.discountAmt)}</td><td class="n">${php(s.total)}</td><td>${esc(s.method)}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No sales recorded.</td></tr>'}</tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="csv" type="button">Copy as CSV</button></div></div>
   <div class="card"><h2>Table capacity</h2><div class="row"><label>Table<select id="cT">${S.tables.map(t=>`<option value="${t.number}">Table ${t.number} · currently ${t.capacity} seats</option>`).join('')}</select></label><label>New capacity<input id="cC" type="number" min="1" value="4"></label><button class="btn p" id="cB" type="button">Update capacity</button></div><div class="err" id="cE"></div>
    <p class="hint">Menu prices and stock are edited on the Menu tab. Tables are added, cleared and removed on the Tables tab.</p></div>
   <div class="card"><h2>Demo data</h2><p class="hint">Everything is stored in this browser only. Reset to restore the original menu, tables and sample sale.</p><button class="btn d" id="reset" type="button">Reset all data</button></div></div>`;
  $('#out').onclick=()=>{staff=false;render()};
  $('#sDate').onchange=e=>{salesDate=e.target.value;render()};
  $('#csv').onclick=()=>{const t='PaidDate,Customer,Table,Subtotal,DiscountType,DiscountAmount,Total,PaymentMethod\n'+rows.map(s=>[s.date,s.customer,s.table,s.subtotal.toFixed(2),s.discount,s.discountAmt.toFixed(2),s.total.toFixed(2),s.method].map(x=>`"${x}"`).join(',')).join('\n');
    navigator.clipboard.writeText(t).then(()=>toast('CSV copied'),()=>toast('Copy not allowed here'))};
  $('#cB').onclick=()=>{const t=table(+$('#cT').value),c=parseInt($('#cC').value);if(!t)return;if(!(c>0))return $('#cE').textContent='Capacity must be greater than 0.';t.capacity=c;toast('Capacity updated');render()};
  $('#reset').onclick=()=>{modal(`<h2>Reset all data?</h2><p>Orders, sales, menu and table changes will be lost.</p><div class="row"><button class="btn d" id="y" type="button">Reset</button><button class="btn" id="n" type="button">Cancel</button></div>`);
    $('#n').onclick=closeModal;$('#y').onclick=()=>{S=defaults();cart={};closeModal();save();render()}};
}

/* ---------- modal + theme ---------- */
function modal(html){$('#modalHost').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div>${html}</div></div>`}
function closeModal(){$('#modalHost').innerHTML=''}
$('#themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
render();
</script>
